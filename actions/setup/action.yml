name: EffectKit workspace setup
description: Install pinned Node, pnpm, optional Bun, and frozen workspace dependencies

inputs:
  node-version:
    description: Override the Node version in .node-version
    default: ""
  bun:
    description: Install Bun from .bun-version
    default: "false"
  cache:
    description: Dependency cache to enable (pnpm or empty)
    default: ""
  ignore-scripts:
    description: Disable dependency lifecycle scripts
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate setup inputs
      shell: bash
      env:
        SETUP_BUN: ${{ inputs.bun }}
        SETUP_CACHE: ${{ inputs.cache }}
        SETUP_IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        case "$SETUP_BUN" in true|false) ;; *) echo 'bun must be true or false' >&2; exit 1 ;; esac
        case "$SETUP_IGNORE_SCRIPTS" in true|false) ;; *) echo 'ignore-scripts must be true or false' >&2; exit 1 ;; esac
        case "$SETUP_CACHE" in pnpm|'') ;; *) echo 'cache must be pnpm or empty' >&2; exit 1 ;; esac

    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .node-version
        cache: ${{ inputs.cache }}
        package-manager-cache: false

    - uses: oven-sh/setup-bun@v2
      if: inputs.bun == 'true'
      with:
        bun-version-file: .bun-version
        no-cache: true

    - name: Install dependencies
      shell: bash
      env:
        SETUP_IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        install_args=(--frozen-lockfile)
        if [ "$SETUP_IGNORE_SCRIPTS" = true ]; then
          install_args+=(--ignore-scripts)
        fi
        pnpm install "${install_args[@]}"
