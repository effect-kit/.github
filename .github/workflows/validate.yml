name: Validate organization repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Node
            bun-version-file: ""
          - runtime: Node and Bun
            bun-version-file: .bun-version
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./actions/setup-toolchain
        with:
          bun-version-file: ${{ matrix.bun-version-file }}
      - run: pnpm check
      - run: pnpm lint:workflows
